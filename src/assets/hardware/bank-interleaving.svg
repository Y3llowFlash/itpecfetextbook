<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 285" width="320" height="285" role="img" aria-labelledby="bank-interleaving-title bank-interleaving-desc"><title id="bank-interleaving-title">Distribute successive addresses</title><desc id="bank-interleaving-desc">Four memory banks contain addresses 0,4,8; 1,5,9; 2,6,10; and 3,7,11. A controller can overlap operations across banks. The bank number is address modulo four in this simplified word-addressed model.</desc><defs><marker id="bank-interleaving-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="35" y="10" width="250" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="38.5" font-size="18" text-anchor="middle">Memory controller</text><path d="M160 55 V80 H43 V105" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#bank-interleaving-arrow)"/><rect x="8" y="110" width="70" height="155" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="43" y="140" font-size="18" text-anchor="middle">Bank 0</text><text x="43" y="177" font-size="18" text-anchor="middle">0</text><text x="43" y="207" font-size="18" text-anchor="middle">4</text><text x="43" y="237" font-size="18" text-anchor="middle">8</text><path d="M160 55 V80 H121 V105" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#bank-interleaving-arrow)"/><rect x="86" y="110" width="70" height="155" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="121" y="140" font-size="18" text-anchor="middle">Bank 1</text><text x="121" y="177" font-size="18" text-anchor="middle">1</text><text x="121" y="207" font-size="18" text-anchor="middle">5</text><text x="121" y="237" font-size="18" text-anchor="middle">9</text><path d="M160 55 V80 H199 V105" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#bank-interleaving-arrow)"/><rect x="164" y="110" width="70" height="155" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="199" y="140" font-size="18" text-anchor="middle">Bank 2</text><text x="199" y="177" font-size="18" text-anchor="middle">2</text><text x="199" y="207" font-size="18" text-anchor="middle">6</text><text x="199" y="237" font-size="18" text-anchor="middle">10</text><path d="M160 55 V80 H277 V105" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#bank-interleaving-arrow)"/><rect x="242" y="110" width="70" height="155" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="277" y="140" font-size="18" text-anchor="middle">Bank 3</text><text x="277" y="177" font-size="18" text-anchor="middle">3</text><text x="277" y="207" font-size="18" text-anchor="middle">7</text><text x="277" y="237" font-size="18" text-anchor="middle">11</text></g></svg>
