<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375" role="img" aria-labelledby="float-formats-title float-formats-desc"><title id="float-formats-title">Normalize, then store the fields</title><desc id="float-formats-desc">Binary 1010.1 normalizes to 1.0101 times two cubed. For binary32 the sign is zero, biased exponent is 130 and the stored fraction begins 0101. Binary32 has field widths 1,8,23; binary64 has 1,11,52 and bias 1023.</desc><defs><marker id="float-formats-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">10.5 = 1010.1₂</text><path d="M160 45 V65" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#float-formats-arrow)"/><rect x="15" y="70" width="290" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="98.5" font-size="18" text-anchor="middle">1.0101₂ × 2³</text><text x="160" y="150" font-size="18" text-anchor="middle">Binary32: S=0; E=3+127=130</text><text x="160" y="181" font-size="18" text-anchor="middle">Stored fraction: 0101…</text><rect x="15" y="220" width="290" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="248.5" font-size="18" text-anchor="middle">32 bits: 1 + 8 + 23</text><rect x="15" y="280" width="290" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="308.5" font-size="18" text-anchor="middle">64 bits: 1 + 11 + 52</text><text x="160" y="351" font-size="18" text-anchor="middle">Binary64 exponent bias: 1023</text></g></svg>
