<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-labelledby="io-processing-title io-processing-desc"><title id="io-processing-title">From physical input to output</title><desc id="io-processing-desc">A document scanner produces image data, memory and the CPU process it, and a printer produces a physical page. Input and output are relative to the computer.</desc><defs><marker id="io-processing-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="30" y="15" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="45" font-size="18" text-anchor="middle">Scanner → image data</text><path d="M160 63 V85" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-processing-arrow)"/><rect x="30" y="91" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="121" font-size="18" text-anchor="middle">Memory + CPU processing</text><path d="M160 139 V161" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-processing-arrow)"/><rect x="30" y="167" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="197" font-size="18" text-anchor="middle">Printer → physical page</text></g></svg>
