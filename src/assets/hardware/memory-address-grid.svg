<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-labelledby="memory-address-grid-title memory-address-grid-desc"><title id="memory-address-grid-title">An address selects a location</title><desc id="memory-address-grid-desc">Address 2 enters a decoder, which selects row 2 from a four-row memory. The selected stored value is hexadecimal A6; the address 2 and data A6 are different.</desc><defs><marker id="memory-address-grid-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="15" y="15" width="290" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="46" font-size="18" text-anchor="middle">Address bus: binary 10</text><path d="M160 65 V90" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-address-grid-arrow)"/><rect x="60" y="95" width="200" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="123.5" font-size="18" text-anchor="middle">Address decoder</text><path d="M160 140 V165" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-address-grid-arrow)"/><rect x="35" y="170" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="193.5" font-size="18" text-anchor="middle">0 : 00</text><rect x="35" y="205" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="228.5" font-size="18" text-anchor="middle">1 : 3F</text><rect x="35" y="240" width="250" height="35" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="263.5" font-size="18" text-anchor="middle">2 : A6  ← selected</text><rect x="35" y="275" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="298.5" font-size="18" text-anchor="middle">3 : 18</text><text x="160" y="335" font-size="18" text-anchor="middle">Data bus returns byte A6</text></g></svg>
