<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" width="320" height="410" role="img" aria-labelledby="memory-cells-title memory-cells-desc"><title id="memory-cells-title">Two ways to retain a working bit</title><desc id="memory-cells-desc">A conceptual DRAM cell connects a data line through a selected transistor to a capacitor, whose charge must be refreshed. SRAM uses feedback to retain state while powered. Both are volatile.</desc><defs><marker id="memory-cells-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="28" font-size="20" text-anchor="middle">DRAM: charge</text><path d="M40 65 H130 M130 45 V85 M140 65 H220 V112" fill="none" stroke="#514d40" stroke-width="2"/><path d="M190 112 H250 M190 121 H250 M220 122 V150" fill="none" stroke="#514d40" stroke-width="2"/><text x="160" y="178" font-size="18" text-anchor="middle">Selected access switch</text><text x="160" y="210" font-size="18" text-anchor="middle">Capacitor → refresh needed</text><text x="160" y="260" font-size="20" text-anchor="middle">SRAM: feedback</text><rect x="25" y="285" width="105" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="77.5" y="313.5" font-size="18" text-anchor="middle">State</text><rect x="190" y="285" width="105" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="242.5" y="313.5" font-size="18" text-anchor="middle">Feedback</text><path d="M130 300 H186" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-cells-arrow)"/><path d="M190 320 H134" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-cells-arrow)"/><text x="160" y="385" font-size="18" text-anchor="middle">Power sustains the stored bit</text></g></svg>
