<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 485" width="320" height="485" role="img" aria-labelledby="disk-geometry-figure-title disk-geometry-figure-desc"><title id="disk-geometry-figure-title">Track, sector, head and cylinder</title><desc id="disk-geometry-figure-desc">A disk surface has concentric tracks and sector wedges. The read/write head sits over one track. A second view marks the same-radius tracks on three surfaces as one cylinder.</desc><defs><marker id="disk-geometry-figure-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><circle cx="160" cy="140" r="35" stroke="#514d40" stroke-width="2" fill="none"/><circle cx="160" cy="140" r="60" stroke="#514d40" stroke-width="2" fill="none"/><circle cx="160" cy="140" r="85" stroke="#514d40" stroke-width="2" fill="none"/><circle cx="160" cy="140" r="110" stroke="#514d40" stroke-width="2" fill="none"/><path d="M160 140 L245 70 M160 140 L270 140" fill="none" stroke="#514d40" stroke-width="2"/><text x="260" y="44" font-size="18" text-anchor="middle">Sector</text><path d="M265 48 L240 80" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#disk-geometry-figure-arrow)"/><rect x="17" y="123" width="90" height="30" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="62" y="144" font-size="18" text-anchor="middle">Head</text><path d="M105 137 H126" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#disk-geometry-figure-arrow)"/><text x="90" y="275" font-size="18" text-anchor="middle">Circular tracks</text><ellipse cx="160" cy="325" rx="115" ry="25" fill="#f4f1e8" stroke="#514d40"/><ellipse cx="160" cy="325" rx="65" ry="14" fill="none" stroke="#514d40"/><ellipse cx="160" cy="370" rx="115" ry="25" fill="#f4f1e8" stroke="#514d40"/><ellipse cx="160" cy="370" rx="65" ry="14" fill="none" stroke="#514d40"/><ellipse cx="160" cy="415" rx="115" ry="25" fill="#f4f1e8" stroke="#514d40"/><ellipse cx="160" cy="415" rx="65" ry="14" fill="none" stroke="#514d40"/><path d="M95 325 V415 M225 325 V415" fill="none" stroke="#514d40" stroke-width="2" stroke-dasharray="5 4"/><text x="160" y="472" font-size="18" text-anchor="middle">Same radius → cylinder</text></g></svg>
