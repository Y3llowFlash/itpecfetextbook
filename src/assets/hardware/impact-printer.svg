<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290" role="img" aria-labelledby="impact-printer-title impact-printer-desc"><title id="impact-printer-title">Pins transfer ink through a ribbon</title><desc id="impact-printer-desc">An impact print head pushes pins toward an ink ribbon, which contacts paper. Pin positions form dots. It contrasts with inkjet droplets and laser-transferred toner.</desc><defs><marker id="impact-printer-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="55" y="15" width="210" height="60" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="51" font-size="18" text-anchor="middle">Print head</text><path d="M95 75 V140" fill="none" stroke="#514d40" stroke-width="2"/><path d="M130 75 V140" fill="none" stroke="#514d40" stroke-width="2"/><path d="M165 75 V140" fill="none" stroke="#514d40" stroke-width="2"/><path d="M200 75 V140" fill="none" stroke="#514d40" stroke-width="2"/><path d="M235 75 V140" fill="none" stroke="#514d40" stroke-width="2"/><path d="M160 145 V172" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#impact-printer-arrow)"/><rect x="20" y="180" width="280" height="25" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="235" font-size="18" text-anchor="middle">Ink ribbon</text><path d="M20 255 H300" fill="none" stroke="#514d40" stroke-width="2"/><text x="160" y="282" font-size="18" text-anchor="middle">Paper receives dots</text></g></svg>
