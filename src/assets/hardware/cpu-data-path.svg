<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 465" width="320" height="465" role="img" aria-labelledby="cpu-data-path-title cpu-data-path-desc"><title id="cpu-data-path-title">Trace an instruction through the CPU</title><desc id="cpu-data-path-desc">Step 1: PC sends an instruction address to memory. Step 2: memory returns the instruction to IR, which feeds the decoder. Step 3: the decoder directs registers and ALU. Step 4: an operand is read and the ALU result is written back. PC advances or branches separately.</desc><defs><marker id="cpu-data-path-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="30" y="10" width="260" height="60" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="46" font-size="18" text-anchor="middle">Main memory</text><rect x="15" y="105" width="290" height="310" rx="5" fill="#fffdf7" stroke="#514d40"/><text x="160" y="126" font-size="20" text-anchor="middle">CPU</text><rect x="30" y="140" width="100" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="168.5" font-size="18" text-anchor="middle">PC</text><rect x="185" y="140" width="100" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="235" y="168.5" font-size="18" text-anchor="middle">IR</text><path d="M80 140 V74" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><path d="M235 70 V136" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><path d="M235 185 V216" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><rect x="170" y="220" width="120" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="230" y="248.5" font-size="18" text-anchor="middle">Decoder</text><path d="M230 265 V295 H95 V321" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)" stroke-dasharray="5 4"/><rect x="30" y="325" width="130" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="95" y="356" font-size="18" text-anchor="middle">Registers</text><path d="M160 350 H181" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><rect x="185" y="325" width="100" height="50" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="235" y="356" font-size="18" text-anchor="middle">ALU</text><path d="M235 375 V395 H95 V379" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><path d="M30 40 H5 V350 H26" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cpu-data-path-arrow)"/><text x="160" y="452" font-size="18" text-anchor="middle">Fetch → decode → execute</text></g></svg>
