<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 345" width="320" height="345" role="img" aria-labelledby="touch-coordinates-title touch-coordinates-desc"><title id="touch-coordinates-title">Relative motion or absolute position</title><desc id="touch-coordinates-desc">A mouse reports a movement of plus 5 in x and minus 2 in y. A touch or digitizer surface identifies a point with absolute x,y coordinates inside its bounds. These are different input models.</desc><defs><marker id="touch-coordinates-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Mouse: change in position</text><path d="M65 120 L235 60" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#touch-coordinates-arrow)"/><text x="160" y="150" font-size="18" text-anchor="middle">Δx = +5; Δy = −2</text><rect x="35" y="190" width="250" height="120" rx="5" fill="#f4f1e8" stroke="#514d40"/><path d="M55 290 H265 M55 290 V205" fill="none" stroke="#514d40" stroke-width="2"/><circle cx="210" cy="230" r="6" stroke="#514d40" stroke-width="2" fill="#e8cf72"/><text x="160" y="334" font-size="18" text-anchor="middle">Touch: a point (x, y)</text></g></svg>
