<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 335" width="320" height="335" role="img" aria-labelledby="sr-latch-title sr-latch-desc"><title id="sr-latch-title">Feedback stores a state</title><desc id="sr-latch-desc">Two cross-coupled NAND gates form an active-low SR latch. S_n enters the upper gate and R_n the lower. Q feeds the lower feedback input; Q-bar feeds the upper feedback input. S_n=0 R_n=1 sets Q; S_n=1 R_n=0 resets Q; both one hold; both zero is forbidden.</desc><defs><marker id="sr-latch-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="30" y="45" font-size="18" text-anchor="middle">S_n</text><text x="30" y="180" font-size="18" text-anchor="middle">R_n</text><path d="M100 20 H125 A25 25 0 0 1 125 70 H100 Z" fill="#f4f1e8" stroke="#514d40"/><circle cx="155" cy="45" r="5" stroke="#514d40" stroke-width="2" fill="#fffdf7"/><path d="M100 155 H125 A25 25 0 0 1 125 205 H100 Z" fill="#f4f1e8" stroke="#514d40"/><circle cx="155" cy="180" r="5" stroke="#514d40" stroke-width="2" fill="#fffdf7"/><path d="M50 35 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M50 170 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M160 45 H285" fill="none" stroke="#514d40" stroke-width="2"/><path d="M160 180 H285" fill="none" stroke="#514d40" stroke-width="2"/><text x="290" y="33" font-size="18" text-anchor="middle">Q</text><text x="285" y="210" font-size="18" text-anchor="middle">Q̅</text><path d="M240 45 V100 L65 130 V193 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M240 180 V125 L65 95 V58 H100" fill="none" stroke="#514d40" stroke-width="2"/><circle cx="240" cy="45" r="3" stroke="#514d40" stroke-width="2" fill="#514d40"/><circle cx="240" cy="180" r="3" stroke="#514d40" stroke-width="2" fill="#514d40"/><text x="160" y="250" font-size="18" text-anchor="middle">S_n R_n: 11 hold · 01 set</text><text x="160" y="283" font-size="18" text-anchor="middle">10 reset · 00 forbidden</text></g></svg>
