<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 335" width="320" height="335" role="img" aria-labelledby="disk-access-timeline-title disk-access-timeline-desc"><title id="disk-access-timeline-title">Three parts of a disk read</title><desc id="disk-access-timeline-desc">A timeline separates head movement (seek), waiting for rotation and transferring the requested bytes. At 7200 rpm, a rotation is 8.333 milliseconds and average rotational waiting is 4.167 milliseconds.</desc><defs><marker id="disk-access-timeline-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="30" y="15" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="45" font-size="18" text-anchor="middle">1. Seek: move head</text><path d="M160 63 V85" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#disk-access-timeline-arrow)"/><rect x="30" y="91" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="121" font-size="18" text-anchor="middle">2. Wait for sector</text><path d="M160 139 V161" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#disk-access-timeline-arrow)"/><rect x="30" y="167" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="197" font-size="18" text-anchor="middle">3. Transfer requested bytes</text><text x="160" y="270" font-size="18" text-anchor="middle">7,200 rpm → 8.333 ms / turn</text><text x="160" y="304" font-size="18" text-anchor="middle">Average wait → 4.167 ms</text></g></svg>
