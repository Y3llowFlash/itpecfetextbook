<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img" aria-labelledby="output-paths-title output-paths-desc"><title id="output-paths-title">A path drawing or a projected image</title><desc id="output-paths-desc">A plotter pen follows an x-y path to mark a physical surface. A projector sends an image using light onto a screen. Both are output, but they produce different physical results.</desc><defs><marker id="output-paths-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="15" y="10" width="290" height="120" rx="5" fill="#f4f1e8" stroke="#514d40"/><path d="M45 100 H100 V45 H200 V100 H270" fill="none" stroke="#514d40" stroke-width="2"/><text x="160" y="156" font-size="18" text-anchor="middle">Plotter: controlled pen path</text><rect x="15" y="200" width="75" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="52.5" y="226" font-size="18" text-anchor="middle">Light</text><path d="M90 210 L265 185 M90 230 L265 265" fill="none" stroke="#514d40" stroke-width="2"/><rect x="265" y="180" width="30" height="90" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="295" font-size="18" text-anchor="middle">Projector: light on screen</text></g></svg>
