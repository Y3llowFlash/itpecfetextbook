<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 405" width="320" height="405" role="img" aria-labelledby="operand-addressing-title operand-addressing-desc"><title id="operand-addressing-title">Follow the dereference</title><desc id="operand-addressing-desc">Instruction field A is 40. Immediate mode uses operand 40; direct mode reads M[40], which is 700; indirect mode follows 700 to M[700], which is 12. Indexed addressing with R equal to 3 selects address 43.</desc><defs><marker id="operand-addressing-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="40" y="10" width="240" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="38.5" font-size="18" text-anchor="middle">Field A = 40</text><text x="160" y="92" font-size="18" text-anchor="middle">Immediate → value 40</text><path d="M160 110 V132" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#operand-addressing-arrow)"/><rect x="40" y="137" width="240" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="168" font-size="18" text-anchor="middle">M[40] = 700</text><text x="160" y="216" font-size="18" text-anchor="middle">Direct → value 700</text><path d="M160 230 V252" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#operand-addressing-arrow)"/><rect x="40" y="257" width="240" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="288" font-size="18" text-anchor="middle">M[700] = 12</text><text x="160" y="343" font-size="18" text-anchor="middle">Indirect → value 12</text><text x="160" y="385" font-size="18" text-anchor="middle">Indexed: EA = 40 + 3 = 43</text></g></svg>
