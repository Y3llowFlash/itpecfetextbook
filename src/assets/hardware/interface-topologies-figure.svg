<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 435" width="320" height="435" role="img" aria-labelledby="interface-topologies-figure-title interface-topologies-figure-desc"><title id="interface-topologies-figure-title">Star, cascade and daisy chain</title><desc id="interface-topologies-figure-desc">A star connects devices to one hub. A cascade connects a hub to another hub, with devices branching from them. A daisy chain connects onward through devices, with a terminator when that interface requires one.</desc><defs><marker id="interface-topologies-figure-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Star</text><rect x="115" y="50" width="90" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="73.5" font-size="18" text-anchor="middle">Hub</text><path d="M115 67 H65 V100" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><path d="M160 85 V100" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><path d="M205 67 H255 V100" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><rect x="30" y="105" width="70" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="65" y="128.5" font-size="18" text-anchor="middle">Device</text><rect x="125" y="105" width="70" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="128.5" font-size="18" text-anchor="middle">Device</text><rect x="220" y="105" width="70" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="255" y="128.5" font-size="18" text-anchor="middle">Device</text><text x="160" y="195" font-size="20" text-anchor="middle">Cascade</text><rect x="20" y="215" width="100" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="70" y="238.5" font-size="18" text-anchor="middle">Hub 1</text><rect x="200" y="215" width="100" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="250" y="238.5" font-size="18" text-anchor="middle">Hub 2</text><path d="M120 232 H196" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><path d="M70 250 V270" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><path d="M250 250 V270" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#interface-topologies-figure-arrow)"/><rect x="20" y="275" width="100" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="70" y="298.5" font-size="18" text-anchor="middle">Device</text><rect x="200" y="275" width="100" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="250" y="298.5" font-size="18" text-anchor="middle">Device</text><text x="160" y="355" font-size="20" text-anchor="middle">Daisy chain</text><rect x="5" y="375" width="80" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="45" y="398.5" font-size="18" text-anchor="middle">Host</text><rect x="115" y="375" width="85" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="157.5" y="398.5" font-size="18" text-anchor="middle">Dev 1</text><rect x="230" y="375" width="85" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272.5" y="398.5" font-size="18" text-anchor="middle">Dev 2</text><path d="M85 392 H111" fill="none" stroke="#514d40" stroke-width="2"/><path d="M200 392 H226" fill="none" stroke="#514d40" stroke-width="2"/></g></svg>
