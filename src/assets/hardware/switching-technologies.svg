oke-width="2"/><path d="M85 283 V295 M85 350 V362" fill="none" stroke="#514d40" stroke-width="2"/><text x="210" y="315" font-size="18" text-anchor="middle">Integrated circuit</text><text x="210" y="341" font-size="18" text-anchor="middle">Many elements</text></g></svg>
