<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 425" width="320" height="425" role="img" aria-labelledby="radix-conversion-steps-title radix-conversion-steps-desc"><title id="radix-conversion-steps-title">Read integer and fraction digits differently</title><desc id="radix-conversion-steps-desc">Repeated division of 26 by two yields remainders 0,1,0,1,1, read upward as 11010. Repeated multiplication of 0.625 by two yields integer parts 1,0,1, read downward as .101.</desc><defs><marker id="radix-conversion-steps-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="28" font-size="20" text-anchor="middle">26: divide by 2</text><text x="145" y="65" font-size="18" text-anchor="middle">26 → 13, remainder 0</text><text x="145" y="93" font-size="18" text-anchor="middle">13 → 6, remainder 1</text><text x="145" y="121" font-size="18" text-anchor="middle">6 → 3, remainder 0</text><text x="145" y="149" font-size="18" text-anchor="middle">3 → 1, remainder 1</text><text x="145" y="177" font-size="18" text-anchor="middle">1 → 0, remainder 1</text><path d="M295 182 V50" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#radix-conversion-steps-arrow)"/><text x="160" y="235" font-size="20" text-anchor="middle">0.625: multiply by 2</text><text x="140" y="275" font-size="18" text-anchor="middle">0.625 × 2 = 1.25 → 1</text><text x="140" y="310" font-size="18" text-anchor="middle">0.25 × 2 = 0.5 → 0</text><text x="140" y="345" font-size="18" text-anchor="middle">0.5 × 2 = 1.0 → 1</text><path d="M295 265 V350" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#radix-conversion-steps-arrow)"/><text x="160" y="405" font-size="18" text-anchor="middle">Integer ↑     Fraction ↓</text></g></svg>
