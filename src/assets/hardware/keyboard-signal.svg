<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-labelledby="keyboard-signal-title keyboard-signal-desc"><title id="keyboard-signal-title">One press, several contact transitions</title><desc id="keyboard-signal-desc">A raw key-contact waveform briefly toggles after the press and then stays high. A debounced waveform changes once after a settling delay. This differs from deliberate held-key repeat.</desc><defs><marker id="keyboard-signal-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Raw contact</text><path d="M20 95 H70 V50 H80 V95 H90 V50 H102 V95 H112 V50 H300" fill="none" stroke="#514d40" stroke-width="2"/><text x="160" y="145" font-size="20" text-anchor="middle">After debouncing</text><path d="M20 215 H140 V170 H300" fill="none" stroke="#514d40" stroke-width="2"/><path d="M70 110 H140" fill="none" stroke="#514d40" stroke-width="2" stroke-dasharray="5 4"/><text x="160" y="252" font-size="18" text-anchor="middle">Time → (illustrative delay)</text></g></svg>
