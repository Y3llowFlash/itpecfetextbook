<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480" role="img" aria-labelledby="logic-symbols-title logic-symbols-desc"><title id="logic-symbols-title">Read the gate symbol</title><desc id="logic-symbols-desc">AND has a flat input side, OR a curved input side and XOR an extra curved line. NOT is a triangle with an output bubble. NAND is AND with a bubble; NOR is OR with a bubble. A bubble means inversion.</desc><defs><marker id="logic-symbols-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="48" y="46" font-size="18" text-anchor="middle">AND</text><path d="M125 15 H150 A25 25 0 0 1 150 65 H125 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M125 27 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M125 53 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M175 40 H275" fill="none" stroke="#514d40" stroke-width="2"/><text x="48" y="122" font-size="18" text-anchor="middle">OR</text><path d="M125 91 Q155 116 125 141 Q170 141 190 116 Q170 91 125 91 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M136 103 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M136 129 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M190 116 H275" fill="none" stroke="#514d40" stroke-width="2"/><text x="48" y="198" font-size="18" text-anchor="middle">XOR</text><path d="M125 167 Q155 192 125 217 Q170 217 190 192 Q170 167 125 167 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M117 167 Q147 192 117 217" fill="none" stroke="#514d40"/><path d="M136 179 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M136 205 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M190 192 H275" fill="none" stroke="#514d40" stroke-width="2"/><text x="48" y="274" font-size="18" text-anchor="middle">NOT</text><path d="M125 243 L173 268 L125 293 Z" fill="#f4f1e8" stroke="#514d40"/><circle cx="178" cy="268" r="5" stroke="#514d40" stroke-width="2" fill="#fffdf7"/><path d="M125 268 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M183 268 H275" fill="none" stroke="#514d40" stroke-width="2"/><text x="48" y="350" font-size="18" text-anchor="middle">NAND</text><path d="M125 319 H150 A25 25 0 0 1 150 369 H125 Z" fill="#f4f1e8" stroke="#514d40"/><circle cx="180" cy="344" r="5" stroke="#514d40" stroke-width="2" fill="#fffdf7"/><path d="M125 331 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M125 357 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M185 344 H275" fill="none" stroke="#514d40" stroke-width="2"/><text x="48" y="426" font-size="18" text-anchor="middle">NOR</text><path d="M125 395 Q155 420 125 445 Q170 445 190 420 Q170 395 125 395 Z" fill="#f4f1e8" stroke="#514d40"/><circle cx="195" cy="420" r="5" stroke="#514d40" stroke-width="2" fill="#fffdf7"/><path d="M136 407 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M136 433 H100" fill="none" stroke="#514d40" stroke-width="2"/><path d="M200 420 H275" fill="none" stroke="#514d40" stroke-width="2"/></g></svg>
