<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 355" width="320" height="355" role="img" aria-labelledby="pixel-grid-title pixel-grid-desc"><title id="pixel-grid-title">A glyph is a grid of samples</title><desc id="pixel-grid-desc">A five-by-seven binary pixel grid forms an A from 35 samples. RGB pixels can use eight bits each for red, green and blue, totaling 24 bits or three bytes per pixel.</desc><defs><marker id="pixel-grid-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="75" y="10" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="109" y="10" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="143" y="10" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="177" y="10" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="211" y="10" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="75" y="44" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="44" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="143" y="44" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="177" y="44" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="211" y="44" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="75" y="78" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="78" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="143" y="78" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="177" y="78" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="211" y="78" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="75" y="112" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="112" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="143" y="112" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="177" y="112" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="211" y="112" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="75" y="146" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="146" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="143" y="146" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="177" y="146" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="211" y="146" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="75" y="180" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="180" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="143" y="180" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="177" y="180" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="211" y="180" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="75" y="214" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><rect x="109" y="214" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="143" y="214" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="177" y="214" width="32" height="32" fill="#f4f1e8" stroke="#d3cdbf"/><rect x="211" y="214" width="32" height="32" fill="#514d40" stroke="#d3cdbf"/><text x="160" y="273" font-size="18" text-anchor="middle">5 columns × 7 rows</text><rect x="10" y="295" width="95" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="57.5" y="321" font-size="18" text-anchor="middle">R: 8 bits</text><rect x="112" y="295" width="95" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="159.5" y="321" font-size="18" text-anchor="middle">G: 8 bits</text><rect x="214" y="295" width="95" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="261.5" y="321" font-size="18" text-anchor="middle">B: 8 bits</text></g></svg>
