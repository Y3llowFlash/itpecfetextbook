<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="five-unit-control-title five-unit-control-desc"><title id="five-unit-control-title">Data paths and control paths</title><desc id="five-unit-control-desc">The control unit sends dashed command paths to input, storage, ALU and output. Solid arrows carry input to storage, storage to ALU and output, and ALU results back to storage.</desc><defs><marker id="five-unit-control-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="90" y="20" width="140" height="48" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="50" font-size="18" text-anchor="middle">Control unit</text><rect x="20" y="140" width="110" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="75" y="171" font-size="18" text-anchor="middle">Input</text><rect x="90" y="245" width="140" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="276" font-size="18" text-anchor="middle">Storage</text><rect x="190" y="140" width="110" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="245" y="171" font-size="18" text-anchor="middle">Output</text><rect x="90" y="350" width="140" height="50" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="381" font-size="18" text-anchor="middle">ALU</text><path d="M75 190 V270 H86" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)"/><path d="M230 270 H245 V194" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)"/><path d="M140 295 V346" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)"/><path d="M180 350 V299" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)"/><path d="M105 68 V115 H75 V136" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)" stroke-dasharray="5 4"/><path d="M160 68 V241" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)" stroke-dasharray="5 4"/><path d="M215 68 V115 H245 V136" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)" stroke-dasharray="5 4"/><path d="M230 44 H310 V375 H234" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#five-unit-control-arrow)" stroke-dasharray="5 4"/></g></svg>
