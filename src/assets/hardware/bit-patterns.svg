<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290" role="img" aria-labelledby="bit-patterns-title bit-patterns-desc"><title id="bit-patterns-title">Bits, patterns and a byte</title><desc id="bit-patterns-desc">A binary tree doubles from two one-bit choices to four two-bit choices. Eight bit cells form one byte, with 256 possible patterns and unsigned values 0 to 255.</desc><defs><marker id="bit-patterns-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="18" text-anchor="middle">1 bit → 2 patterns</text><rect x="65" y="45" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="95" y="69" font-size="18" text-anchor="middle">0</text><rect x="195" y="45" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="225" y="69" font-size="18" text-anchor="middle">1</text><path d="M95 81 L55 118" fill="none" stroke="#514d40" stroke-width="2"/><path d="M95 81 L125 118" fill="none" stroke="#514d40" stroke-width="2"/><path d="M225 81 L195 118" fill="none" stroke="#514d40" stroke-width="2"/><path d="M225 81 L265 118" fill="none" stroke="#514d40" stroke-width="2"/><rect x="25" y="120" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="55" y="144" font-size="18" text-anchor="middle">00</text><rect x="95" y="120" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="125" y="144" font-size="18" text-anchor="middle">01</text><rect x="165" y="120" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="195" y="144" font-size="18" text-anchor="middle">10</text><rect x="235" y="120" width="60" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="265" y="144" font-size="18" text-anchor="middle">11</text><text x="160" y="188" font-size="18" text-anchor="middle">2 bits → 4 patterns</text><rect x="32" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="48" y="232" font-size="18" text-anchor="middle">1</text><rect x="64" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="232" font-size="18" text-anchor="middle">0</text><rect x="96" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="112" y="232" font-size="18" text-anchor="middle">1</text><rect x="128" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="144" y="232" font-size="18" text-anchor="middle">0</text><rect x="160" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="176" y="232" font-size="18" text-anchor="middle">0</text><rect x="192" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="208" y="232" font-size="18" text-anchor="middle">1</text><rect x="224" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="232" font-size="18" text-anchor="middle">0</text><rect x="256" y="207" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272" y="232" font-size="18" text-anchor="middle">1</text><text x="160" y="274" font-size="18" text-anchor="middle">1 byte = 8 bits = 256 patterns</text></g></svg>
