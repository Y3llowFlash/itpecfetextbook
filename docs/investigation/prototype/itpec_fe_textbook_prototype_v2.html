<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITPEC FE Textbook</title><style>:root{--c:#425ce0}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f7f8fc;color:#243044}button{cursor:pointer;border:1px solid #dce1ec;background:white;padding:11px 15px;border-radius:10px;font:inherit}button:hover{border-color:var(--c)}.primary{background:var(--c);color:white}header{background:white;border-bottom:1px solid #e5e8ef;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header span{color:var(--c)}.layout{display:grid;grid-template-columns:225px minmax(0,1fr) 235px;min-height:90vh}aside{background:white;padding:22px 12px;border-right:1px solid #e5e8ef}aside:last-child{border-left:1px solid #e5e8ef;border-right:0}.label{font-size:11px;letter-spacing:1px;color:#8490a0;font-weight:800;margin:15px 10px}.nav{display:block;width:100%;border:0;text-align:left;margin:4px 0}.active{background:#edf0ff;color:var(--c);font-weight:750}main{max-width:900px;width:100%;margin:auto;padding:35px clamp(15px,5vw,60px)}h1{font-size:clamp(29px,4vw,43px);letter-spacing:-1px;margin:12px 0}h2{font-size:22px}.muted{color:#778499}.small{font-size:12px}.card{background:white;border:1px solid #e5e8f0;border-radius:16px;padding:24px;margin:20px 0}.card p{font-size:var(--fs,17px);line-height:1.85}.tag{display:inline-block;background:#edf0ff;color:var(--c);font-size:11px;font-weight:800;padding:7px 10px;border-radius:7px}.highlight{background:#ffedaa;border-bottom:2px solid #d6ad32;cursor:pointer;padding:3px;border-radius:4px}.callout{background:#eef2ff;border-radius:12px;padding:16px;margin:20px 0}.choice{display:block;border:1px solid #e0e5ef;border-radius:10px;padding:14px;margin:10px 0;cursor:pointer}.choice:has(input:checked){background:#edf0ff;border-color:var(--c)}input{accent-color:var(--c)}.feedback{background:#fff0df;border-radius:12px;padding:18px;margin:20px 0}.good{background:#e4f7ed}.video{display:flex;gap:15px;align-items:center;background:white;border:1px solid #e4e8ef;padding:14px;border-radius:12px;margin:15px 0}.thumb{min-width:105px;height:75px;border-radius:10px;background:#c4e4f6;color:#18547b;display:grid;place-items:center;text-align:center;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--c)}.side{padding:15px;border:1px solid #e4e8ef;border-radius:12px;margin:15px 0}.side p{font-size:12px;color:#778499;line-height:1.6}.overlay{position:fixed;inset:0;background:#17243c88;display:grid;place-items:center;padding:15px;z-index:9}.modal{background:white;border-radius:18px;padding:25px;max-width:440px;width:100%}.modal p{line-height:1.7}@media(max-width:1050px){.layout{grid-template-columns:210px 1fr}aside:last-child{display:none}}@media(max-width:650px){header{padding:12px}header b{font-size:16px}.layout{display:block}aside:first-child{display:flex;overflow:auto;padding:6px}.label,.chapters{display:none}.nav{white-space:nowrap;width:auto}main{padding:20px 14px}.card{padding:18px}}.question-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.qcount{background:#e8f6f3;color:#087d72;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800}.qnav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.qnav button{min-width:42px}.qnav button.current{background:var(--c);color:white}.question-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.highlight:hover{background:#ffdf78}.question-head{border-bottom:1px solid #e5e8ef;padding-bottom:14px;margin-bottom:20px}.backlink{border:0;background:transparent;color:var(--c);padding:6px 0;font-weight:700}.qstatus{font-size:12px;color:#778499}.source-note{font-size:12px;color:#778499;margin-top:10px}@media(max-width:650px){.question-actions button{flex:1}} </style><header><b>▣ ITPEC FE <span>Textbook</span></b><div><button onclick="settings()">⚙ Customize</button> <button class="primary" onclick="account()">Save progress</button></div></header><div class="layout"><aside><div class="label">LEARNING SPACE</div><button class="nav" onclick="go('read')">▤ Textbook</button><button class="nav" onclick="go('practice')">✎ Section practice</button><button class="nav" onclick="go('cet')">◈ CET practice</button><button class="nav" onclick="go('progress')">▥ My progress</button><div class="chapters"><div class="label">CHAPTERS</div><div id="chapters"></div></div></aside><main id="main"></main><aside><div class="label">STUDY COMPANION</div><div class="side"><b>Learning progress</b><p id="pct"></p><div class="bar"><div class="fill" id="fill"></div></div><p>Guest progress saves in this browser.</p></div><div class="side"><b>✦ Exam highlights</b><p>Click yellow concepts to practice.</p></div><div class="side"><b>▶ Free videos</b><p>Get help after question review.</p><button onclick="video()">Explore free lesson</button></div></aside></div><div id="overlay"></div><script>
const data=[['Hardware','CPU Architecture','The CPU executes instructions and coordinates computer operations.','The Arithmetic Logic Unit (ALU) performs arithmetic and logical operations.','Registers provide fast temporary storage inside the CPU.','Which CPU component performs arithmetic and logical operations?',['Control Unit','Arithmetic Logic Unit (ALU)','Main Memory','I/O Controller'],1,'The ALU handles arithmetic and logical operations.'],['Software','Operating Systems','Operating systems manage hardware and provide services to applications.','A process is a program in execution.','Operating systems schedule processes and manage memory.','What is a process?',['A program stored on disk','A program currently executing','A CPU component','Read-only memory'],1,'A process is a running instance of a program.'],['Algorithms','Binary Search','Binary search repeatedly halves the search interval.','Binary search requires sorted data.','Its typical time complexity is O(log n).','What is required for binary search?',['Random data','Sorted data','Unique values only','Exactly 100 elements'],1,'Sorted order lets binary search discard half the remaining elements.'],['Networks','Network Fundamentals','Networks allow devices to exchange information.','An IP address identifies a network interface in an IP network.','Routers forward packets between networks.','Which device forwards packets between networks?',['Router','Keyboard','Monitor','Printer'],0,'A router forwards packets between IP networks.']];let s={page:'read',i:0,answer:-1,checked:false,high:true,done:{},tries:0,signed:false,size:17,color:'#425ce0',qIndex:0,readingScroll:0,originChapter:0};try{Object.assign(s,JSON.parse(localStorage.getItem('itpec_demo')||'{}'))}catch{}function save(){localStorage.setItem('itpec_demo',JSON.stringify(s))}function go(p){s.page=p;s.answer=-1;s.checked=false;render()}function chapter(i){s.i=i;s.readingScroll=0;go('read')}function choose(i){s.answer=i;s.checked=false;render()}function check(){if(s.answer<0)return;s.checked=true;s.tries++;if(s.answer===data[s.i][7])s.done[s.i]=true;save();render()}function complete(){s.done[s.i]=true;save();render();if(!s.signed)account()}const relatedQuestions=data.map((d,i)=>[{prompt:d[5],options:d[6],correct:d[7],explanation:d[8],source:'Sample question · Concept check'}, {prompt:`Which statement about ${d[1].toLowerCase()} is correct?`,options:[d[3], 'It is unrelated to computer systems.', 'It never appears in computer science.', 'It can only be understood through memorization.'],correct:0,explanation:d[3]+' '+d[8],source:'Sample question · Understanding'}, {prompt:`Choose the accurate statement for ${d[0]}.`,options:['Every computer concept works the same way.',d[3], 'No technical definition is necessary.', 'This concept cannot be tested.'],correct:1,explanation:d[8],source:'Sample question · Review'}]);
function openRelated(){s.originChapter=s.i;s.readingScroll=window.scrollY;s.page='related';s.qIndex=0;s.answer=-1;s.checked=false;render();window.scrollTo(0,0)}
function relatedNext(delta){const arr=relatedQuestions[s.originChapter];s.qIndex=Math.max(0,Math.min(arr.length-1,s.qIndex+delta));s.answer=-1;s.checked=false;render();window.scrollTo(0,0)}
function relatedJump(n){s.qIndex=n;s.answer=-1;s.checked=false;render();window.scrollTo(0,0)}
function returnToTextbook(){s.i=s.originChapter;s.page='read';s.answer=-1;s.checked=false;render();requestAnimationFrame(()=>window.scrollTo(0,s.readingScroll||0))}
function related(){let d=data[s.originChapter],arr=relatedQuestions[s.originChapter],q=arr[s.qIndex],total=arr.length;return `<button class="backlink" onclick="returnToTextbook()">← Return to textbook</button><div class="muted small">Chapter ${s.originChapter+1}: ${d[0]} / ${d[1]}</div><h1>Related Questions</h1><div class="question-meta"><span class="qcount">${total} related questions</span><span class="muted small">Concept: ${d[3]}</span></div><div class="card"><div class="question-head row"><span class="tag">QUESTION ${s.qIndex+1} OF ${total}</span><span class="qstatus">${q.source}</span></div><h2>${q.prompt}</h2>${q.options.map((opt,i)=>`<label class="choice"><input type="radio" name="related-answer" ${s.answer===i?'checked':''} onchange="choose(${i})"> ${'ABCD'[i]}. ${opt}</label>`).join('')}<button class="primary" onclick="checkRelated()" ${s.answer<0?'disabled':''}>Check answer →</button>${s.checked?`<div class="feedback ${s.answer===q.correct?'good':''}"><b>${s.answer===q.correct?'✓ Correct!':'ⓘ Not quite!'}</b><p>${q.explanation}</p><div class="video"><div class="thumb">▶ FREE<br>LESSON</div><div><b>Finding this question difficult?</b><div class="small muted">Watch a free explanation before trying again.</div></div></div><button class="primary" onclick="video()">Explore free video ↗</button> <button onclick="s.answer=-1;s.checked=false;render()">Try again</button><hr><p class="small muted">OPTIONAL NEXT STEP</p><b>Want a complete guided course?</b><p><a href="#" onclick="funnel();return false">Explore The 1% ITPEC Course →</a></p></div>`:''}<div class="qnav">${arr.map((_,i)=>`<button class="${i===s.qIndex?'current':''}" onclick="relatedJump(${i})" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><div class="question-actions"><button onclick="relatedNext(-1)" ${s.qIndex===0?'disabled':''}>← Previous</button><button class="primary" onclick="relatedNext(1)" ${s.qIndex===total-1?'disabled':''}>Next question →</button><button onclick="returnToTextbook()">↩ Return to textbook</button></div></div><p class="source-note">Prototype uses ${total} illustrative questions per concept. Actual counts and questions will come from verified ITPEC mappings.</p>`}
function checkRelated(){if(s.answer<0)return;s.checked=true;s.tries++;save();render()}
function read(){let d=data[s.i];return `<div class="muted small">Textbook / Chapter ${s.i+1}</div><h1>Chapter ${s.i+1}: ${d[0]}</h1><p class="muted">Read, understand, practice, master.</p><div class="card"><div class="row"><span class="tag">INTERACTIVE TEXTBOOK</span><label class="small"><input type="checkbox" ${s.high?'checked':''} onchange="s.high=this.checked;save();render()"> Exam highlights</label></div><h2>${s.i+1}.1 ${d[1]}</h2><p>${d[2]}</p><p>${s.high?`<span class="highlight" onclick="openRelated()">${d[3]}</span>`:d[3]}</p><p>${d[4]}</p><button onclick="complete()">${s.done[s.i]?'✓ Completed':'Mark complete'}</button> <button onclick="go('practice')">Section practice →</button></div>`}function practice(){let d=data[s.i];return `<div class="muted small">${s.page==='cet'?'CET demo':'Section practice'} / ${d[0]}</div><h1>${s.page==='cet'?'CET Practice':'Practice: '+d[0]}</h1><p class="muted">Illustrative question, not imported exam data.</p><div class="card"><span class="tag">SAMPLE QUESTION</span><h2>${d[5]}</h2>${d[6].map((x,i)=>`<label class="choice"><input type="radio" name="q" ${s.answer===i?'checked':''} onchange="choose(${i})"> ${'ABCD'[i]}. ${x}</label>`).join('')}<button class="primary" onclick="check()">Check answer →</button>${s.checked?`<div class="feedback ${s.answer===d[7]?'good':''}"><b>${s.answer===d[7]?'✓ Correct!':'ⓘ Not quite!'}</b><p>${d[8]}</p><div class="video"><div class="thumb">▶ FREE<br>LESSON</div><div><b>Finding this question difficult?</b><div class="small muted">Watch a free explanation before trying again.</div></div></div><button class="primary" onclick="video()">Explore free video ↗</button> <button onclick="s.answer=-1;s.checked=false;render()">Try again</button><hr><p class="small muted">OPTIONAL NEXT STEP</p><b>Want a complete guided course?</b><p><a href="#" onclick="funnel();return false">Explore The 1% ITPEC Course →</a></p></div>`:''}</div><button onclick="go('read')">← Back to textbook</button>`}function progress(){let n=Object.keys(s.done).filter(k=>s.done[k]).length;return `<h1>My learning progress</h1><p class="muted">Read, practice and grow.</p><div class="card"><h2>${n}/4 sections completed · ${s.tries} attempts</h2>${data.map((d,i)=>`<p><b>${d[0]}</b> — ${s.done[i]?'✓ Completed':'Not completed'}</p><div class="bar"><div class="fill" style="width:${s.done[i]?100:0}%"></div></div>`).join('')}<div class="callout"><b>Keep your progress safe!</b><p>Sign in to sync across devices in the future.</p><button class="primary" onclick="account()">Save progress — free</button></div></div>`}function render(){document.documentElement.style.setProperty('--c',s.color);document.documentElement.style.setProperty('--fs',s.size+'px');document.getElementById('chapters').innerHTML=data.map((d,i)=>`<button class="nav ${s.i===i?'active':''}" onclick="chapter(${i})">${i+1}. ${d[0]} ${s.done[i]?'✓':''}</button>`).join('');document.getElementById('main').innerHTML=s.page==='read'?read():s.page==='related'?related():s.page==='progress'?progress():practice();let n=Object.keys(s.done).filter(k=>s.done[k]).length;document.getElementById('pct').textContent=n*25+'% completed';document.getElementById('fill').style.width=n*25+'%'}function modal(h){document.getElementById('overlay').innerHTML=`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${h}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function account(){modal(`<h2>Keep your learning progress!</h2><p>✓ Save completed lessons<br>✓ Keep question history<br>✓ Continue on another device</p><p class="small muted">This prototype only simulates sign-in. No real account or cloud sync is connected.</p><button class="primary" onclick="s.signed=!s.signed;save();closeModal();render()">${s.signed?'Switch to guest':'Simulate free sign-in'}</button> <button onclick="closeModal()">Continue as guest</button>`)}function settings(){modal(`<h2>Customize experience</h2><p>Accent color</p><select onchange="s.color=this.value;save();render()"><option value="#425ce0">Indigo</option><option value="#148c80">Teal</option><option value="#b36d2d">Amber</option></select><p>Reading size</p><input type="range" min="14" max="23" value="${s.size}" oninput="s.size=+this.value;save();render()"><p><button class="primary" onclick="closeModal()">Done</button> <button onclick="if(confirm('Reset demo progress?')){localStorage.removeItem('itpec_demo');location.reload()}">Reset demo</button></p>`)}function video(){modal(`<h2>▶ Free video lesson</h2><div class="thumb" style="width:100%;height:150px">YOUR FREE YOUTUBE LESSON</div><p><b>${data[s.i][1]}</b></p><p class="muted">Placeholder: real YouTube links will be connected to concepts.</p><button class="primary" onclick="closeModal()">Back to learning</button>`)}function funnel(){modal(`<h2>The 1% ITPEC Course</h2><p>Optional deeper learning with guided lessons. This is a funnel placement demo; no checkout is connected.</p><button onclick="closeModal()">Continue free learning</button>`)}render();</script></html>
