<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" width="320" height="350" role="img" aria-labelledby="record-blocks-title record-blocks-desc"><title id="record-blocks-title">Records, blocks and unused space</title><desc id="record-blocks-desc">A 512-byte block contains five 100-byte records and 12 unused bytes. A second schematic shows variable-length recorded blocks separated by interblock gaps, distinct from unused space inside a block.</desc><defs><marker id="record-blocks-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">512-byte block</text><rect x="35" y="45" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="68.5" font-size="18" text-anchor="middle">Record 1 · 100 bytes</text><rect x="35" y="80" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="103.5" font-size="18" text-anchor="middle">Record 2 · 100 bytes</text><rect x="35" y="115" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="138.5" font-size="18" text-anchor="middle">Record 3 · 100 bytes</text><rect x="35" y="150" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="173.5" font-size="18" text-anchor="middle">Record 4 · 100 bytes</text><rect x="35" y="185" width="250" height="35" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="208.5" font-size="18" text-anchor="middle">Record 5 · 100 bytes</text><rect x="35" y="220" width="250" height="35" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="243.5" font-size="18" text-anchor="middle">12 bytes unused</text><text x="160" y="292" font-size="18" text-anchor="middle">Variable-block recording:</text><rect x="10" y="310" width="100" height="32" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="60" y="332" font-size="18" text-anchor="middle">Block A</text><text x="155" y="334" font-size="18" text-anchor="middle">gap</text><rect x="210" y="310" width="100" height="32" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="260" y="332" font-size="18" text-anchor="middle">Block B</text></g></svg>
