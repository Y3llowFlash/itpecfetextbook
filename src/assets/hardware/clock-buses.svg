<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 355" width="320" height="355" role="img" aria-labelledby="clock-buses-title clock-buses-desc"><title id="clock-buses-title">Timing and three bus roles</title><desc id="clock-buses-desc">Two rising edges delimit one clock period. CPU sends addresses and read/write control to memory; a bidirectional data path carries values. A 100 MHz clock has a 10 nanosecond period.</desc><defs><marker id="clock-buses-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><path d="M30 70 H60 V30 H105 V70 H150 V30 H195 V70 H240 V30 H285" fill="none" stroke="#514d40" stroke-width="2"/><path d="M60 90 H150" fill="none" stroke="#514d40" stroke-width="2"/><text x="105" y="120" font-size="18" text-anchor="middle">1 period</text><text x="160" y="155" font-size="18" text-anchor="middle">100 MHz → 10 ns</text><rect x="10" y="205" width="90" height="130" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="55" y="276" font-size="18" text-anchor="middle">CPU</text><rect x="220" y="205" width="90" height="130" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="265" y="276" font-size="18" text-anchor="middle">RAM</text><path d="M100 225 H216" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#clock-buses-arrow)"/><text x="160" y="211" font-size="18" text-anchor="middle">Address</text><path d="M100 270 H216" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#clock-buses-arrow)"/><path d="M220 278 H104" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#clock-buses-arrow)"/><text x="160" y="259" font-size="18" text-anchor="middle">Data</text><path d="M100 320 H216" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#clock-buses-arrow)" stroke-dasharray="5 4"/><text x="160" y="308" font-size="18" text-anchor="middle">Control</text></g></svg>
