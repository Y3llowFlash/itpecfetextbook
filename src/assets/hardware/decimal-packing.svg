<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375" role="img" aria-labelledby="decimal-packing-title decimal-packing-desc"><title id="decimal-packing-title">Decimal digits packed into nibbles</title><desc id="decimal-packing-desc">Decimal 672 becomes BCD nibbles 0110, 0111, 0010. A common signed packed representation is hexadecimal 67 2C for positive 672. EBCDIC-style zoned positive digits are F6 F7 C2, with the final zone holding the sign.</desc><defs><marker id="decimal-packing-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Decimal digits: 6   7   2</text><text x="160" y="70" font-size="18" text-anchor="middle">BCD: one nibble per digit</text><text x="160" y="102" font-size="18" text-anchor="middle">0110 | 0111 | 0010</text><path d="M160 120 V150" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#decimal-packing-arrow)"/><rect x="25" y="155" width="270" height="50" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="186" font-size="18" text-anchor="middle">Packed: 67 | 2C</text><text x="160" y="236" font-size="18" text-anchor="middle">C = positive sign nibble</text><rect x="25" y="265" width="270" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="296" font-size="18" text-anchor="middle">Zoned: F6 | F7 | C2</text><text x="160" y="347" font-size="18" text-anchor="middle">Pack / unpack for I/O formats</text></g></svg>
