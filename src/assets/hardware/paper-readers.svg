<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375" role="img" aria-labelledby="paper-readers-title paper-readers-desc"><title id="paper-readers-title">Recognition and capture differ</title><desc id="paper-readers-desc">OCR recognizes the printed glyph A; OMR reads a filled option position; a barcode reader decodes bars; MICR senses magnetic characters; a scanner captures pixels before any recognition.</desc><defs><marker id="paper-readers-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="50" y="45" font-size="30" text-anchor="middle">A</text><path d="M85 40 H130" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#paper-readers-arrow)"/><text x="230" y="46" font-size="18" text-anchor="middle">OCR → character</text><circle cx="30" cy="110" r="7" stroke="#514d40" stroke-width="2" fill="none"/><circle cx="55" cy="110" r="7" stroke="#514d40" stroke-width="2" fill="#514d40"/><circle cx="80" cy="110" r="7" stroke="#514d40" stroke-width="2" fill="none"/><path d="M100 110 H135" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#paper-readers-arrow)"/><text x="235" y="116" font-size="18" text-anchor="middle">OMR → position</text><rect x="18" y="160" width="6" height="34" fill="#514d40"/><rect x="28" y="160" width="3" height="34" fill="#514d40"/><rect x="38" y="160" width="6" height="34" fill="#514d40"/><rect x="48" y="160" width="3" height="34" fill="#514d40"/><rect x="58" y="160" width="6" height="34" fill="#514d40"/><rect x="68" y="160" width="3" height="34" fill="#514d40"/><rect x="78" y="160" width="6" height="34" fill="#514d40"/><rect x="88" y="160" width="3" height="34" fill="#514d40"/><path d="M110 180 H135" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#paper-readers-arrow)"/><text x="235" y="186" font-size="18" text-anchor="middle">Bars → code</text><text x="55" y="255" font-size="18" text-anchor="middle">Magnetic</text><path d="M110 250 H135" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#paper-readers-arrow)"/><text x="235" y="255" font-size="18" text-anchor="middle">MICR → symbols</text><rect x="15" y="305" width="90" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="60" y="331" font-size="18" text-anchor="middle">Pixels</text><path d="M110 325 H135" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#paper-readers-arrow)"/><text x="235" y="331" font-size="18" text-anchor="middle">Scan → image</text></g></svg>
