<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 385" width="320" height="385" role="img" aria-labelledby="numeric-errors-title numeric-errors-desc"><title id="numeric-errors-title">Precision and range are different limits</title><desc id="numeric-errors-desc">With three significant decimal digits, 1.234 rounds to 1.23. Subtracting the rounded 1.234 and 1.233 gives zero instead of the exact 0.001. Adding 1 to 1.00 million can lose the small term. Underflow concerns tiny magnitudes near zero; overflow concerns excessive magnitude of either sign.</desc><defs><marker id="numeric-errors-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Round: 1.234 → 1.23</text><rect x="10" y="60" width="300" height="90" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="90" font-size="18" text-anchor="middle">Cancellation after rounding:</text><text x="160" y="125" font-size="18" text-anchor="middle">1.23 − 1.23 = 0</text><rect x="10" y="175" width="300" height="90" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="205" font-size="18" text-anchor="middle">Small term may disappear:</text><text x="160" y="240" font-size="18" text-anchor="middle">1.00 × 10⁶ + 1 → 1.00 × 10⁶</text><text x="160" y="315" font-size="18" text-anchor="middle">Underflow: tiny |value|</text><text x="160" y="350" font-size="18" text-anchor="middle">Overflow: excessive |value|</text></g></svg>
