<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" width="320" height="350" role="img" aria-labelledby="data-format-tree-title data-format-tree-desc"><title id="data-format-tree-title">The meaning comes from the format</title><desc id="data-format-tree-desc">Data branches into character codes and numeric formats. Numeric formats branch into decimal digit codes and binary formats, with fixed point and floating point under binary.</desc><defs><marker id="data-format-tree-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="100" y="10" width="120" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="36" font-size="18" text-anchor="middle">Data</text><path d="M160 50 V75 H80 V95" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><path d="M160 75 H240 V95" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><rect x="5" y="100" width="150" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="131" font-size="18" text-anchor="middle">Characters</text><rect x="165" y="100" width="150" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="131" font-size="18" text-anchor="middle">Numbers</text><path d="M240 150 V170 H85 V195" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><path d="M240 170 V195" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><rect x="5" y="200" width="155" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="82.5" y="231" font-size="18" text-anchor="middle">Decimal codes</text><rect x="175" y="200" width="140" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="245" y="231" font-size="18" text-anchor="middle">Binary</text><path d="M245 250 V270 H85 V295" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><path d="M245 270 V295" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#data-format-tree-arrow)"/><rect x="10" y="300" width="145" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="82.5" y="326" font-size="18" text-anchor="middle">Fixed point</text><rect x="165" y="300" width="150" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="326" font-size="18" text-anchor="middle">Floating point</text></g></svg>
