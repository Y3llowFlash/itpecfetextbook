<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 275" width="320" height="275" role="img" aria-labelledby="computer-forms-title computer-forms-desc"><title id="computer-forms-title">Different forms, different roles</title><desc id="computer-forms-desc">Original outlines show a rack, a desktop screen, a laptop and a handheld device. Size and shape do not determine whether a computer acts as a server or a client.</desc><defs><marker id="computer-forms-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="20" y="20" width="70" height="105" rx="5" fill="#f4f1e8" stroke="#514d40"/><rect x="30" y="40" width="50" height="14" rx="5" fill="#f4f1e8" stroke="#514d40"/><rect x="30" y="65" width="50" height="14" rx="5" fill="#f4f1e8" stroke="#514d40"/><rect x="30" y="90" width="50" height="14" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="205" y="72" font-size="18" text-anchor="middle">Rack system</text><rect x="25" y="158" width="60" height="40" rx="5" fill="#f4f1e8" stroke="#514d40"/><path d="M55 198 V212 M35 212 H75" fill="none" stroke="#514d40" stroke-width="2"/><text x="205" y="185" font-size="18" text-anchor="middle">Desktop</text><rect x="27" y="234" width="55" height="27" rx="5" fill="#f4f1e8" stroke="#514d40"/><path d="M20 263 H90" fill="none" stroke="#514d40" stroke-width="2"/><text x="205" y="256" font-size="18" text-anchor="middle">Portable computer</text></g></svg>
