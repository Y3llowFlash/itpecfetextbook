<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" width="320" height="310" role="img" aria-labelledby="pipeline-stalls-title pipeline-stalls-desc"><title id="pipeline-stalls-title">A stall delays following work</title><desc id="pipeline-stalls-desc">A three-stage pipeline takes a bubble when instruction I2 cannot execute. In cycles 1 through 6, I1 runs F D E; I2 runs F D wait E; I3 runs F wait D E. A deeper pipeline splits stages but still must handle dependencies.</desc><defs><marker id="pipeline-stalls-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Cycles → 1  2  3  4  5  6</text><rect x="15" y="50" width="290" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="81" font-size="18" text-anchor="middle">I1: F D E · · ·</text><rect x="15" y="110" width="290" height="50" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="141" font-size="18" text-anchor="middle">I2: · F D wait E ·</text><rect x="15" y="170" width="290" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="201" font-size="18" text-anchor="middle">I3: · · F wait D E</text><text x="160" y="260" font-size="18" text-anchor="middle">Deeper pipeline: smaller stages</text><text x="160" y="290" font-size="18" text-anchor="middle">F → D1 → D2 → E1 → E2</text></g></svg>
