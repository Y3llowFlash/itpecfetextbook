<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="adders-title adders-desc"><title id="adders-title">A full adder from two half adders</title><desc id="adders-desc">Half adder 1 takes A and B and gives intermediate sum s1 and carry c1. Half adder 2 takes s1 and carry-in, and gives sum and carry c2. OR combines c1 and c2 into carry-out.</desc><defs><marker id="adders-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="85" y="25" font-size="18" text-anchor="middle">A, B</text><path d="M85 40 V60" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><rect x="20" y="65" width="130" height="65" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="85" y="103.5" font-size="18" text-anchor="middle">Half adder 1</text><path d="M85 130 V195" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><text x="55" y="170" font-size="18" text-anchor="middle">s1</text><path d="M150 95 H195 V332 H206" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><text x="218" y="165" font-size="18" text-anchor="middle">c1</text><text x="260" y="215" font-size="18" text-anchor="middle">Carry-in</text><path d="M230 225 H154" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><rect x="20" y="200" width="130" height="65" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="85" y="238.5" font-size="18" text-anchor="middle">Half adder 2</text><path d="M85 265 V308" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><text x="85" y="338" font-size="18" text-anchor="middle">Sum</text><path d="M150 240 H175 V358 H206" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><text x="154" y="290" font-size="18" text-anchor="middle">c2</text><rect x="210" y="320" width="75" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="247.5" y="351" font-size="18" text-anchor="middle">OR</text><path d="M247 370 V388" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#adders-arrow)"/><text x="247" y="415" font-size="18" text-anchor="middle">Carry-out</text></g></svg>
