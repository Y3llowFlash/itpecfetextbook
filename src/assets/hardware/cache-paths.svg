<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-labelledby="cache-paths-title cache-paths-desc"><title id="cache-paths-title">Buffering at different levels</title><desc id="cache-paths-desc">CPU registers connect through primary and secondary cache to main memory, and then through a disk-cache role to storage. A miss continues down the hierarchy; a hit returns earlier. A disk cache may use part of main RAM.</desc><defs><marker id="cache-paths-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="30" y="15" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="45" font-size="18" text-anchor="middle">Registers</text><path d="M160 63 V85" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cache-paths-arrow)"/><rect x="30" y="91" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="121" font-size="18" text-anchor="middle">L1 / L2 cache</text><path d="M160 139 V161" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cache-paths-arrow)"/><rect x="30" y="167" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="197" font-size="18" text-anchor="middle">Main memory</text><path d="M160 215 V237" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cache-paths-arrow)"/><rect x="30" y="243" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="273" font-size="18" text-anchor="middle">Disk-cache role</text><path d="M160 291 V313" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#cache-paths-arrow)"/><rect x="30" y="319" width="260" height="48" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="349" font-size="18" text-anchor="middle">Storage device</text></g></svg>
