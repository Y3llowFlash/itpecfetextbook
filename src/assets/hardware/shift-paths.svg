<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375" role="img" aria-labelledby="shift-paths-title shift-paths-desc"><title id="shift-paths-title">Three ways to shift right</title><desc id="shift-paths-desc">Starting with 10010110, logical right shift inserts zero to give 01001011; arithmetic right shift repeats one to give 11001011; rotate right wraps the discarded zero to give 01001011. Rotation differs from a shift even when this example’s results match.</desc><defs><marker id="shift-paths-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Start: 10010110</text><text x="160" y="75" font-size="18" text-anchor="middle">Logical: insert 0</text><rect x="32" y="90" width="32" height="36" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="48" y="115" font-size="18" text-anchor="middle">0</text><rect x="64" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="115" font-size="18" text-anchor="middle">1</text><rect x="96" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="112" y="115" font-size="18" text-anchor="middle">0</text><rect x="128" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="144" y="115" font-size="18" text-anchor="middle">0</text><rect x="160" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="176" y="115" font-size="18" text-anchor="middle">1</text><rect x="192" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="208" y="115" font-size="18" text-anchor="middle">0</text><rect x="224" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="115" font-size="18" text-anchor="middle">1</text><rect x="256" y="90" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272" y="115" font-size="18" text-anchor="middle">1</text><text x="160" y="170" font-size="18" text-anchor="middle">Arithmetic: repeat sign 1</text><rect x="32" y="185" width="32" height="36" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="48" y="210" font-size="18" text-anchor="middle">1</text><rect x="64" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="210" font-size="18" text-anchor="middle">1</text><rect x="96" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="112" y="210" font-size="18" text-anchor="middle">0</text><rect x="128" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="144" y="210" font-size="18" text-anchor="middle">0</text><rect x="160" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="176" y="210" font-size="18" text-anchor="middle">1</text><rect x="192" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="208" y="210" font-size="18" text-anchor="middle">0</text><rect x="224" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="210" font-size="18" text-anchor="middle">1</text><rect x="256" y="185" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272" y="210" font-size="18" text-anchor="middle">1</text><text x="160" y="265" font-size="18" text-anchor="middle">Rotate: wrap outgoing 0</text><rect x="32" y="280" width="32" height="36" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="48" y="305" font-size="18" text-anchor="middle">0</text><rect x="64" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="305" font-size="18" text-anchor="middle">1</text><rect x="96" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="112" y="305" font-size="18" text-anchor="middle">0</text><rect x="128" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="144" y="305" font-size="18" text-anchor="middle">0</text><rect x="160" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="176" y="305" font-size="18" text-anchor="middle">1</text><rect x="192" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="208" y="305" font-size="18" text-anchor="middle">0</text><rect x="224" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="305" font-size="18" text-anchor="middle">1</text><rect x="256" y="280" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272" y="305" font-size="18" text-anchor="middle">1</text><path d="M284 336 V355 H36 V320" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#shift-paths-arrow)" stroke-dasharray="5 4"/></g></svg>
