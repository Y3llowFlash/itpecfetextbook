<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290" role="img" aria-labelledby="xor-network-title xor-network-desc"><title id="xor-network-title">Construct XOR from two cases</title><desc id="xor-network-desc">Input A and inverted B feed the upper AND gate. Inverted A and B feed the lower AND gate. The two AND outputs feed OR, so Y equals A AND NOT B OR NOT A AND B.</desc><defs><marker id="xor-network-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="35" y="33" font-size="18" text-anchor="middle">A</text><text x="35" y="58" font-size="18" text-anchor="middle">NOT B</text><text x="35" y="188" font-size="18" text-anchor="middle">NOT A</text><text x="35" y="213" font-size="18" text-anchor="middle">B</text><path d="M110 15 H135 A25 25 0 0 1 135 65 H110 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M110 170 H135 A25 25 0 0 1 135 220 H110 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M70 27 H110 M70 53 H110 M70 182 H110 M70 208 H110" fill="none" stroke="#514d40" stroke-width="2"/><path d="M160 40 H180 V110 H221" fill="none" stroke="#514d40" stroke-width="2"/><path d="M160 195 H180 V136 H221" fill="none" stroke="#514d40" stroke-width="2"/><path d="M210 98 Q240 123 210 148 Q255 148 275 123 Q255 98 210 98 Z" fill="#f4f1e8" stroke="#514d40"/><path d="M275 123 H300" fill="none" stroke="#514d40" stroke-width="2"/><text x="302" y="153" font-size="18" text-anchor="middle">Y</text><text x="160" y="270" font-size="18" text-anchor="middle">Y = (A AND ¬B) OR (¬A AND B)</text></g></svg>
