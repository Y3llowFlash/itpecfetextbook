<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 305" width="320" height="305" role="img" aria-labelledby="radix-grouping-title radix-grouping-desc"><title id="radix-grouping-title">Group from the radix point</title><desc id="radix-grouping-desc">The same binary pattern 101101.101 is grouped as 101 101 point 101 for octal 55.5 and as 0010 1101 point 1010 for hexadecimal 2D.A. Only outer padding zeros are added.</desc><defs><marker id="radix-grouping-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Binary: 101101.101</text><text x="160" y="70" font-size="18" text-anchor="middle">Octal: groups of 3</text><rect x="25" y="90" width="270" height="43" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="117.5" font-size="18" text-anchor="middle">101 | 101 . 101</text><text x="160" y="160" font-size="18" text-anchor="middle">5       5  .   5</text><text x="160" y="204" font-size="18" text-anchor="middle">Hex: groups of 4</text><rect x="10" y="220" width="300" height="43" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="247.5" font-size="18" text-anchor="middle">0010 | 1101 . 1010</text><text x="160" y="282" font-size="18" text-anchor="middle">2        D   .    A</text></g></svg>
