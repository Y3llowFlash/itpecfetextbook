<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" width="320" height="390" role="img" aria-labelledby="repeating-fraction-title repeating-fraction-desc"><title id="repeating-fraction-title">A recurring remainder creates recurring bits</title><desc id="repeating-fraction-desc">Starting with decimal fraction 0.1, repeated multiplication by two emits bits 0,0,0,1,1 and leaves remainders 0.2,0.4,0.8,0.6,0.2. The remainder 0.2 repeats, so subsequent bits repeat 0011.</desc><defs><marker id="repeating-fraction-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="18" text-anchor="middle">Fraction × 2 → bit, remainder</text><rect x="30" y="45" width="260" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="73.5" font-size="18" text-anchor="middle">0.1 × 2 → 0, 0.2</text><rect x="30" y="100" width="260" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="128.5" font-size="18" text-anchor="middle">0.2 × 2 → 0, 0.4</text><rect x="30" y="155" width="260" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="183.5" font-size="18" text-anchor="middle">0.4 × 2 → 0, 0.8</text><rect x="30" y="210" width="260" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="238.5" font-size="18" text-anchor="middle">0.8 × 2 → 1, 0.6</text><rect x="30" y="265" width="260" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="293.5" font-size="18" text-anchor="middle">0.6 × 2 → 1, 0.2</text><path d="M290 285 H310 V120 H294" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#repeating-fraction-arrow)" stroke-dasharray="5 4"/><text x="160" y="365" font-size="18" text-anchor="middle">Remainder 0.2 repeats → loop</text></g></svg>
