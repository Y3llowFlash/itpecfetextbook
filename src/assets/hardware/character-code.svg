<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="320" height="330" role="img" aria-labelledby="character-code-title character-code-desc"><title id="character-code-title">A character code is a lookup</title><desc id="character-code-desc">The Latin capital letter A is U+0041 in Unicode and 0x41 in ASCII. Its UTF-8 byte is hexadecimal 41, binary 01000001. A grid uses high nibble 4 and low nibble 1 to locate hexadecimal 41.</desc><defs><marker id="character-code-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="105" y="10" width="110" height="55" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="43.5" font-size="18" text-anchor="middle">A</text><text x="160" y="97" font-size="18" text-anchor="middle">Unicode: U+0041</text><text x="160" y="125" font-size="18" text-anchor="middle">ASCII / UTF-8 byte: 0x41</text><rect x="32" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="48" y="175" font-size="18" text-anchor="middle">0</text><rect x="64" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="80" y="175" font-size="18" text-anchor="middle">1</text><rect x="96" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="112" y="175" font-size="18" text-anchor="middle">0</text><rect x="128" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="144" y="175" font-size="18" text-anchor="middle">0</text><rect x="160" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="176" y="175" font-size="18" text-anchor="middle">0</text><rect x="192" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="208" y="175" font-size="18" text-anchor="middle">0</text><rect x="224" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="240" y="175" font-size="18" text-anchor="middle">0</text><rect x="256" y="150" width="32" height="36" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="272" y="175" font-size="18" text-anchor="middle">1</text><text x="160" y="220" font-size="18" text-anchor="middle">High nibble 4; low nibble 1</text><rect x="60" y="245" width="200" height="60" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="281" font-size="18" text-anchor="middle">4 × 16 + 1 = 65</text></g></svg>
