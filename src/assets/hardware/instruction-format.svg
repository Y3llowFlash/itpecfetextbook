<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-labelledby="instruction-format-title instruction-format-desc"><title id="instruction-format-title">An instruction contains fields</title><desc id="instruction-format-desc">An illustrative sixteen-bit instruction has a four-bit opcode, a four-bit register field and an eight-bit operand field. The format is a teaching example, not a particular ISA.</desc><defs><marker id="instruction-format-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="28" font-size="20" text-anchor="middle">Example 16-bit instruction</text><rect x="30" y="60" width="260" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="88.5" font-size="18" text-anchor="middle">Opcode · 4 bits</text><rect x="30" y="110" width="260" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="138.5" font-size="18" text-anchor="middle">Register · 4 bits</text><rect x="30" y="160" width="260" height="55" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="193.5" font-size="18" text-anchor="middle">Operand field · 8 bits</text><text x="160" y="242" font-size="18" text-anchor="middle">4 + 4 + 8 = 16 bits</text></g></svg>
