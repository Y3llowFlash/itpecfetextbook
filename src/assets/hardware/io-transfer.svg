<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" width="320" height="350" role="img" aria-labelledby="io-transfer-title io-transfer-desc"><title id="io-transfer-title">Who moves the block?</title><desc id="io-transfer-desc">Programmed transfer routes data from device through the CPU to memory. DMA routes data between a device controller and memory after CPU setup, then notifies the CPU on completion.</desc><defs><marker id="io-transfer-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Programmed transfer</text><rect x="10" y="50" width="90" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="55" y="78.5" font-size="18" text-anchor="middle">Device</text><rect x="115" y="50" width="90" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="78.5" font-size="18" text-anchor="middle">CPU</text><rect x="220" y="50" width="90" height="45" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="265" y="78.5" font-size="18" text-anchor="middle">RAM</text><path d="M100 73 H111" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-transfer-arrow)"/><path d="M205 73 H216" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-transfer-arrow)"/><text x="160" y="150" font-size="20" text-anchor="middle">DMA block transfer</text><rect x="10" y="190" width="130" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="75" y="221" font-size="18" text-anchor="middle">Controller</text><rect x="215" y="190" width="95" height="50" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="262.5" y="221" font-size="18" text-anchor="middle">RAM</text><path d="M140 215 H211" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-transfer-arrow)"/><rect x="95" y="290" width="130" height="45" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="318.5" font-size="18" text-anchor="middle">CPU</text><path d="M145 290 V260 H75 V244" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-transfer-arrow)" stroke-dasharray="5 4"/><path d="M125 240 V270 H195 V286" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#io-transfer-arrow)" stroke-dasharray="5 4"/><text x="160" y="180" font-size="18" text-anchor="middle">Device ↔ controller</text></g></svg>
