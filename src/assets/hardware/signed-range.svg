<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 335" width="320" height="335" role="img" aria-labelledby="signed-range-title signed-range-desc"><title id="signed-range-title">Two signed four-bit interpretations</title><desc id="signed-range-desc">For four bits, sign-magnitude uses 0000 for plus zero and 1000 for minus zero, spanning minus 7 to plus 7. Two’s complement uses one zero, spans minus 8 to plus 7, and gives 1000 the value minus 8.</desc><defs><marker id="signed-range-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><text x="160" y="25" font-size="20" text-anchor="middle">Four bits: 16 patterns</text><rect x="20" y="55" width="280" height="90" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="85" font-size="18" text-anchor="middle">Sign-magnitude</text><text x="160" y="115" font-size="18" text-anchor="middle">−7 … −0, +0 … +7</text><rect x="20" y="170" width="280" height="90" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="200" font-size="18" text-anchor="middle">Two’s complement</text><text x="160" y="230" font-size="18" text-anchor="middle">−8 … −1, 0 … +7</text><text x="160" y="300" font-size="18" text-anchor="middle">1000 = −8; 0111 = +7</text></g></svg>
