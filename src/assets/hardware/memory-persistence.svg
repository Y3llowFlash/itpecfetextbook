<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="320" height="330" role="img" aria-labelledby="memory-persistence-title memory-persistence-desc"><title id="memory-persistence-title">Working memory and persistent storage</title><desc id="memory-persistence-desc">Programs and data move from auxiliary storage into main memory for CPU use. Main RAM loses ordinary state without power; nonvolatile storage retains its recorded state.</desc><defs><marker id="memory-persistence-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#514d40"/></marker></defs><g fill="#302e27" font-family="system-ui, sans-serif"><rect x="40" y="15" width="240" height="55" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="48.5" font-size="18" text-anchor="middle">CPU</text><path d="M145 70 V105" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-persistence-arrow)"/><path d="M175 110 V74" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-persistence-arrow)"/><rect x="40" y="110" width="240" height="55" rx="5" fill="#e8cf72" stroke="#514d40"/><text x="160" y="143.5" font-size="18" text-anchor="middle">Main RAM</text><text x="160" y="190" font-size="18" text-anchor="middle">Volatile working state</text><path d="M145 205 V245" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-persistence-arrow)"/><path d="M175 250 V209" fill="none" stroke="#514d40" stroke-width="2" marker-end="url(#memory-persistence-arrow)"/><rect x="40" y="250" width="240" height="55" rx="5" fill="#f4f1e8" stroke="#514d40"/><text x="160" y="283.5" font-size="18" text-anchor="middle">Auxiliary storage</text></g></svg>
